# Lidarr, Sonarr's counterpart for music: http://<this machine>:8686, root folder
# /data/media/music. Prowlarr gives it its indexers once added there.
services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    depends_on:
      folders:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      LIDARR__AUTH__APIKEY: ${LIDARR_API_KEY:?set LIDARR_API_KEY in .env}
    ports:
      - "${LIDARR_PORT:-8686}:8686"
    volumes:
      - lidarr:/config
      - ${DATA_DIR}:/data

volumes:
  lidarr:
