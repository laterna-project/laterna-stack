# Recyclarr keeps the quality profiles and custom formats of Sonarr and Radarr in line with the
# TRaSH Guides, every day: RECYCLARR_PROFILES=english (original language) or french (MULTi.VF),
# from config/recyclarr. It creates the profiles; pick them for your series and movies.
services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    restart: unless-stopped
    # Its own user: it writes only to its volume, never to DATA_DIR.
    environment:
      TZ: ${TZ:-UTC}
      CRON_SCHEDULE: "@daily"
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
    volumes:
      - recyclarr:/config
      - ./config/recyclarr/${RECYCLARR_PROFILES:-english}.yml:/config/recyclarr.yml:ro

volumes:
  recyclarr:
